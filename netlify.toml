# Netlify builds every push to main and publishes dist/ to keeparoadmap.com.
# The build needs nothing but Node.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Serve the Markdown files the page links to as readable text.
[[headers]]
  for = "/CREDITS.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/index.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/ROADMAP.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/sitemap.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/LICENSE"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/examples/*"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
